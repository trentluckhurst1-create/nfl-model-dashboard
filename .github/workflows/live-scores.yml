name: Refresh NFL Live Scores
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: nfl-live-scores
  cancel-in-progress: true
jobs:
  live-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_scores.py
      - run: |
          git config user.name "nfl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "data: refresh live scoreboard"
          git pull --rebase origin main
          git push
