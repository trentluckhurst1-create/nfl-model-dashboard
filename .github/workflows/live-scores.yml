name: Refresh NFL Live Scores (Manual Fallback)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edgeiq-data-writers
  cancel-in-progress: false
jobs:
  live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_scores.py
      - run: |
          git config user.name "edgeiq-nfl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json
          if git diff --cached --quiet; then
            echo "No scoreboard changes"
            exit 0
          fi
          git commit -m "data: manual live-score fallback refresh"
          git pull --rebase origin main
          git push
