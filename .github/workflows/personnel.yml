name: Refresh EDGEiQ NFL Personnel
on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
permissions:
  contents: write
concurrency:
  group: edgeiq-nfl-personnel
  cancel-in-progress: true
jobs:
  personnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_personnel.py
      - run: |
          git config user.name "edgeiq-nfl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/personnel.json
          git diff --cached --quiet || git commit -m "data: refresh EDGEiQ NFL personnel"
          git pull --rebase origin main
          git push
