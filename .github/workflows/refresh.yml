name: Refresh EDGEiQ NFL Operations
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: edgeiq-data-writers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_dashboard.py
      - run: |
          git config user.name "edgeiq-nfl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/news.json data/changes.json
          if git diff --cached --quiet; then
            echo "No published-data changes"
            exit 0
          fi
          git commit -m "data: refresh EDGEiQ NFL operations"
          git pull --rebase origin main
          git push
