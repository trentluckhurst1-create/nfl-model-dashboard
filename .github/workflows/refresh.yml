name: Refresh NFL Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update_dashboard.py
      - run: |
          git config user.name "nfl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/news.json
          git diff --cached --quiet || git commit -m "data: refresh NFL terminal"
          git push
